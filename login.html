<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | BarberShop</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="page-dark flex-center">

    <div class="auth-box">
        <div class="auth-header">
            <h1 class="title-form">Admin Access</h1>
            <p class="desc-form">Sign in to manage your barbershop.</p>
        </div>

        <form id="loginForm" class="editorial-form">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" required placeholder="admin@barbershop.com">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>
            
            <button type="submit" id="loginBtn" class="btn-submit">Sign In</button>
        </form>

        <div class="auth-footer">
            <a href="index.html">← Back to Website</a>
        </div>
    </div>

    <script src="js/supabase.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
