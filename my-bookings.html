<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Bookings | BarberShop</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="page-light">

    <nav class="navbar" style="mix-blend-mode: normal; color: var(--text-dark);">
        <div class="logo">Barber<span>Shop.</span></div>
        <div class="nav-links">
            <a href="index.html" class="btn-outline">← Back to Home</a>
        </div>
    </nav>

    <main class="my-bookings-section">
        <div class="container">
            
            <div class="booking-header">
                <h1 class="title-form" style="color: var(--text-dark);">My Bookings</h1>
                <p class="desc-form" style="color: #666;">Masukkan nomor HP yang Anda gunakan saat memesan.</p>
            </div>

            <form id="searchForm" class="search-form">
                <input type="tel" id="searchPhone" required placeholder="Contoh: 08123456789">
                <button type="submit" class="btn-submit" style="width: auto; margin-top: 0;">Cari</button>
            </form>

            <div id="bookingResults" class="results-container">
                <!-- Hasil pencarian akan muncul di sini -->
            </div>

        </div>
    </main>

    <script src="js/supabase.js"></script>
    <script src="js/my-bookings.js"></script>
</body>
</html>
