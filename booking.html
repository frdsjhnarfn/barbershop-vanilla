<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Your Seat | BarberShop</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="page-dark">

    <!-- Navbar Minimalis (Hanya Logo dan Tombol Kembali) -->
    <nav class="navbar">
        <div class="logo">Barber<span>Shop.</span></div>
        <div class="nav-links">
            <a href="index.html" class="btn-outline">← Back to Home</a>
        </div>
    </nav>

    <!-- Form Section -->
    <main class="booking-section">
        <div class="container booking-container">
            
            <div class="booking-header">
                <h1 class="title-form">Book Your Seat</h1>
                <p class="desc-form">Fill in the details below to reserve your premium appointment.</p>
            </div>

            <form id="bookingForm" class="editorial-form">
                
                <!-- Grid 2 Kolom -->
                <div class="form-row">
                    <div class="form-group">
                        <label for="customer_name">Full Name</label>
                        <input type="text" id="customer_name" name="customer_name" required placeholder="John Doe">
                    </div>
                    <div class="form-group">
                        <label for="customer_phone">Phone Number</label>
                        <input type="tel" id="customer_phone" name="customer_phone" required placeholder="08123456789">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="service_id">Select Service</label>
                        <select id="service_id" name="service_id" required>
                            <option value="" disabled selected>Loading services...</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="barber_id">Select Barber</label>
                        <select id="barber_id" name="barber_id" required>
                            <option value="" disabled selected>Loading barbers...</option>
                        </select>
                    </div>
                </div>

                <!-- Pilihan Hair Style (Berbentuk Kartu Visual) -->
                <div class="form-row" id="hairStyleRow" style="display: none;">
                    <div class="form-group full-width">
                        <label>Pilih Gaya Rambut</label>
                        <!-- Input hidden untuk menyimpan nilai yang dipilih -->
                        <input type="hidden" id="hair_style" name="hair_style" required>
                        
                        <div class="hair-style-grid">
                            <!-- Item 1 -->
                            <div class="style-card" data-value="Classic Taper">
                                <img src="assets/hair-styles/classic-taper.jpg" alt="Classic Taper">
                                <span>Classic Taper</span>
                            </div>
                            <!-- Item 2 -->
                            <div class="style-card" data-value="Textured Fringe">
                                <img src="assets/hair-styles/textured-fringe.jpg" alt="Textured Fringe">
                                <span>Textured Fringe</span>
                            </div>
                            <!-- Item 3 -->
                            <div class="style-card" data-value="Pompadour">
                                <img src="assets/hair-styles/pompadour.jpg" alt="Pompadour">
                                <span>Pompadour</span>
                            </div>
                            <!-- Item 4 -->
                            <div class="style-card" data-value="Buzz Cut">
                                <img src="assets/hair-styles/buzz-cut.jpg" alt="Buzz Cut">
                                <span>Buzz Cut</span>
                            </div>
                            <!-- Item 5 -->
                            <div class="style-card" data-value="Fade (Mid/High)">
                                <img src="assets/hair-styles/fade.jpg" alt="Fade">
                                <span>Fade (Mid/High)</span>
                            </div>
                            <!-- Item 6 -->
                            <div class="style-card" data-value="Crew Cut">
                                <img src="assets/hair-styles/crew-cut.jpg" alt="Crew Cut">
                                <span>Crew Cut</span>
                            </div>
                            <!-- Item 7 -->
                            <div class="style-card" data-value="Lainnya (Diskusi)">
                                <img src="assets/hair-styles/consultation.jpg" alt="Diskusi">
                                <span>Lainnya (Diskusi)</span>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="booking_date">Date</label>
                        <input type="date" id="booking_date" name="booking_date" required>
                    </div>
                    <div class="form-group">
                        <label for="booking_time">Time</label>
                        <input type="time" id="booking_time" name="booking_time" required>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" id="submitBtn" class="btn-submit">
                        Confirm Booking
                    </button>
                </div>

            </form>
        </div>
    </main>

    <!-- Script -->
    <script src="js/supabase.js"></script>
    <script src="js/booking.js"></script>
</body>
</html>
