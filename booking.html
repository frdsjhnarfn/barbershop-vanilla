<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Your Look | BarberShop</title>
    
    <!-- Google Fonts: VPLOSS Style (Archivo Black, Inter, JetBrains Mono) -->
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@300;400;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- Main CSS -->
    <link rel="stylesheet" href="css/style.css">

    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Library Animasi: Motion (Vanilla) -->
    <script type="module">
        import { animate, scroll, inView } from "https://cdn.jsdelivr.net/npm/motion@latest/+esm";
        window.Motion = { animate, scroll, inView };
    </script>
    
    <!-- Library Animasi: Anime.js -->
    <script src="https://cdn.jsdelivr.net/npm/animejs@4/dist/anime.min.js"></script>
</head>
<body class="page-dark-vploss">

    <!-- Navbar VPLOSS -->
    <nav class="navbar-vploss">
        <div class="logo-vploss">BARBER<span>SHOP.</span></div>
        <div class="nav-links">
            <a href="index.html" class="link-vploss">← BACK</a>
        </div>
    </nav>

    <!-- Main Section -->
    <main class="booking-section-vploss">
        <div class="container-vploss">
            
            <div class="booking-header-vploss">
                <h1 class="title-vploss" id="mainTitle">SELECT YOUR LOOK</h1>
                <p class="desc-vploss">CHOOSE YOUR HAIR STYLE & BOOK YOUR SESSION</p>
            </div>

            <form id="bookingForm" class="editorial-form-vploss">
                
                <!-- Grid Input Data Pelanggan -->
                <div class="form-grid-vploss">
                    <div class="form-group-vploss">
                        <label>FULL NAME</label>
                        <input type="text" id="customer_name" required placeholder="JOHN DOE">
                    </div>
                    <div class="form-group-vploss">
                        <label>PHONE</label>
                        <input type="tel" id="customer_phone" required placeholder="0812...">
                    </div>
                    <div class="form-group-vploss">
                        <label>SELECT SERVICE</label>
                        <select id="service_id" required>
                            <option value="" disabled selected>LOADING...</option>
                        </select>
                    </div>
                    <div class="form-group-vploss">
                        <label>SELECT BARBER</label>
                        <select id="barber_id" required>
                            <option value="" disabled selected>LOADING...</option>
                        </select>
                    </div>
                    <div class="form-group-vploss">
                        <label>DATE</label>
                        <input type="date" id="booking_date" required>
                    </div>
                    <div class="form-group-vploss">
                        <label>TIME</label>
                        <input type="time" id="booking_time" required>
                    </div>
                </div>

                <!-- Section Hair Style (Tampil jika layanan Cut) -->
                <div id="hairStyleRow" style="display: none;" class="hairstyle-section-vploss">
                    <h2 class="subtitle-vploss">SELECT HAIR STYLE</h2>
                    <!-- Hidden input untuk menyimpan nilai -->
                    <input type="hidden" id="hair_style" name="hair_style">
                    
                    <div class="hair-style-grid-vploss" id="hairStyleGrid">
                        
                        <!-- CLASSIC TAPER -->
                        <div class="style-card-vploss" data-value="Classic Taper">
                            <img src="assets/hair-styles/classic-taper.jpg" alt="Classic Taper">
                            <div class="overlay-vploss">
                                <span class="style-name-vploss">CLASSIC TAPER</span>
                            </div>
                        </div>

                        <!-- TEXTURED FRINGE -->
                        <div class="style-card-vploss" data-value="Textured Fringe">
                            <img src="assets/hair-styles/textured-fringe.jpg" alt="Textured Fringe">
                            <div class="overlay-vploss">
                                <span class="style-name-vploss">TEXTURED FRINGE</span>
                            </div>
                        </div>

                        <!-- POMPADOUR -->
                        <div class="style-card-vploss" data-value="Pompadour">
                            <img src="assets/hair-styles/pompadour.jpg" alt="Pompadour">
                            <div class="overlay-vploss">
                                <span class="style-name-vploss">POMPADOUR</span>
                            </div>
                        </div>

                        <!-- FADE -->
                        <div class="style-card-vploss" data-value="Fade (Mid/High)">
                            <img src="assets/hair-styles/fade.jpg" alt="Fade">
                            <div class="overlay-vploss">
                                <span class="style-name-vploss">FADE (MID/HIGH)</span>
                            </div>
                        </div>

                        <!-- BUZZ CUT -->
                        <div class="style-card-vploss" data-value="Buzz Cut">
                            <img src="assets/hair-styles/buzz-cut.jpg" alt="Buzz Cut">
                            <div class="overlay-vploss">
                                <span class="style-name-vploss">BUZZ CUT</span>
                            </div>
                        </div>

                        <!-- CREW CUT -->
                        <div class="style-card-vploss" data-value="Crew Cut">
                            <img src="assets/hair-styles/crew-cut.jpg" alt="Crew Cut">
                            <div class="overlay-vploss">
                                <span class="style-name-vploss">CREW CUT</span>
                            </div>
                        </div>

                        <!-- LAINNYA / DISKUSI -->
                        <div class="style-card-vploss" data-value="Lainnya (Diskusi)">
                            <img src="assets/hair-styles/consultation.jpg" alt="Diskusi">
                            <div class="overlay-vploss">
                                <span class="style-name-vploss">DISKUSI</span>
                            </div>
                        </div>

                    </div>
                </div>

                <!-- Tombol Submit -->
                <div class="form-actions-vploss">
                    <button type="submit" id="submitBtn" class="btn-vploss">
                        CONFIRM BOOKING
                    </button>
                </div>

            </form>
        </div>
    </main>

    <!-- Main JS -->
    <script src="js/supabase.js"></script>
    <script src="js/booking.js"></script>
</body>
</html>
